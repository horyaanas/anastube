name: Build SnapTube APK

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build SnapTube Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Outputs
        run: |
          mkdir -p build-artifacts
          cp app/build/outputs/apk/debug/*.apk build-artifacts/SnapTube-v1.0.0-debug.apk
          ls -la build-artifacts/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnapTube-v1.0.0-debug-apk
          path: build-artifacts/SnapTube-v1.0.0-debug.apk
          retention-days: 30

      - name: Add Job Summary
        run: |
          echo "### 🚀 SnapTube APK Build Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **File:** \`SnapTube-v1.0.0-debug.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** Signed with Android Debug Keystore (Ready for direct installation)" >> $GITHUB_STEP_SUMMARY
          echo "- **Download:** Check the **Artifacts** tab on this workflow run." >> $GITHUB_STEP_SUMMARY
